services:
  # Service 1: Train the model
  model-training:
    image: python:3.10-slim
    container_name: ml_trainer
    working_dir: /app
    environment:
      MODEL_DIR: /exchange         # model_training.py saves the model + metrics here
    volumes:
      - ./src:/app/src:ro
      - ./requirements.txt:/app/requirements.txt:ro
      - ./requirements-serving.txt:/app/requirements-serving.txt:ro
      - model_exchange:/exchange   # Shared volume mount
      - pip_cache:/root/.cache/pip # Reuse downloaded packages between runs
    # Train -> model is written straight into the shared volume
    command: >
      sh -c "pip install -r requirements.txt &&
             python src/model_training.py"

  # Service 2: Serve the model
  serving:
    image: python:3.10-slim
    container_name: ml_serving
    working_dir: /app
    environment:
      PORT: 80
      MODEL_PATH: /exchange/my_model.keras
      METRICS_PATH: /exchange/metrics.json
      TF_CPP_MIN_LOG_LEVEL: 2
    ports:
      - "${HOST_PORT:-80}:80"      # HOST_PORT=8080 docker compose up  -> if port 80 is taken
    volumes:
      - ./src:/app/src:ro          # includes src/templates and src/statics
      - ./requirements-serving.txt:/app/requirements-serving.txt:ro
      - model_exchange:/exchange:ro  # Shared volume mount (read-only here)
      - pip_cache:/root/.cache/pip
    depends_on:
      model-training:
        condition: service_completed_successfully
    # Read the model FROM the shared volume -> Run server
    command: >
      sh -c "pip install -r requirements-serving.txt &&
             exec gunicorn --chdir src --bind 0.0.0.0:80 --workers 1 --threads 4 --access-logfile - main:app"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:80/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      start_period: 120s           # pip install runs first, so give it time
      retries: 3
    restart: unless-stopped

volumes:
  model_exchange:
  pip_cache:
